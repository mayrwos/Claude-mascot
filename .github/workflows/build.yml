name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build installer (NSIS + MSI)
        run: npx tauri build --bundles nsis,msi
      - name: Collect files
        id: collect
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/claude-mascot.exe "out/ClaudeMascot-Portable-$v.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeMascot-windows
          path: out/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Mascot v${{ steps.collect.outputs.version }}
          make_latest: true
          body: |
            A pixel desktop pet for Claude Code on Windows.

            **Download one of these:**
            - `Claude.Mascot_*_x64-setup.exe` — installer, no admin rights needed
            - `ClaudeMascot-Portable-*.exe` — a single file, nothing to install
            - `Claude.Mascot_*_x64_en-US.msi` — the same installer as MSI

            On first start it offers to connect to Claude Code. Then start or restart Claude Code.
            Windows may show SmartScreen on the first launch: More info → Run anyway.
          files: out/*
