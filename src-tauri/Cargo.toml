[package]
name = "claude-mascot"
version = "1.3.0"
description = "Desktop pet for Claude Code: the orange pixel Claude that reacts to what Claude Code is doing"
authors = ["mayrwos"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "claude_mascot_lib"
path = "src/lib.rs"

[[bin]]
name = "claude-mascot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
